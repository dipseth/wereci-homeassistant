show_cook_display:
  fields:
    entity_id:
      example: media_player.kitchen_display
      selector:
        entity:
          domain: media_player
    browser_id:
      example: kitchen-tablet
      selector:
        text:
    recipe:
      example: carrot soup
      selector:
        text:
    recipe_id:
      example: 9c811224-dc73-5052-a3f1-d8e93a4e22da
      selector:
        text:
    without_phone:
      default: false
      selector:
        boolean:
    allow_closest:
      default: false
      selector:
        boolean:
    notify:
      example: "[notify.mobile_app_my_phone]"
      selector:
        text:
          multiple: true
    dashboard_path:
      default: wereci-cook
      selector:
        text:
    view_path:
      selector:
        text:
    return_path:
      default: /
      selector:
        text:
    config_entry_id:
      selector:
        config_entry:
          integration: wereci
stop_cook_display:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: wereci
toggle_ingredient:
  fields:
    index:
      required: true
      example: 0
      selector:
        number:
          min: 0
          mode: box
    config_entry_id:
      selector:
        config_entry:
          integration: wereci
